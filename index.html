<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<!--head-->
<title>פריים הרפתקה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Karantina:wght@400;700&family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, an expedition journal lit by a camera monitor: View&Finder family palette (dark, amber, mono read-outs, viewfinder frames) over a faint treasure map, with parchment map pieces as rewards. */
:root{
  --bg:#0f0b07; --panel:#1a140d; --panel2:#130e09; --line:#3b2f1f; --fg:#f3e9d2; --dim:#a89a82;
  --parch:#e9d6a6; --parch-ink:#2b1c0c; --title:"Suez One","Karantina","Heebo",serif;
  --accent:#f2b33d; --accent-ink:#1a1405; --ok:#5fd18a; --warn:#ff8a5c; --rec:#e8322f;
  --ui:"Heebo",system-ui,-apple-system,"Segoe UI","Arial Hebrew",Arial,sans-serif;
  --display:"Karantina","Heebo",Impact,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:18px;line-height:1.5;
  background-image:radial-gradient(ellipse 90% 460px at 50% -80px,rgba(242,140,40,.22),rgba(242,140,40,0)),url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22980%22 viewBox=%220 0 640 980%22 fill=%22none%22 stroke=%22%23f2b33d%22 stroke-linecap=%22round%22%3E%3Cg opacity=%22.07%22 stroke-width=%221.2%22%3E%3Cpath d=%22M-20 210C90 150 170 250 290 200S520 120 660 190%22/%3E%3Cpath d=%22M-20 250C90 190 180 290 300 240S520 165 660 235%22/%3E%3Cpath d=%22M-20 640C120 590 200 700 330 650S540 580 660 640%22/%3E%3Cpath d=%22M-20 685C120 635 210 745 340 695S540 625 660 690%22/%3E%3Cpath d=%22M430 420c40-30 110-20 120 30s-50 80-100 60-60-60-20-90z%22/%3E%3Cpath d=%22M455 440c25-18 65-12 72 18s-30 48-60 36-36-36-12-54z%22/%3E%3C/g%3E%3Cpath opacity=%22.16%22 stroke-width=%223%22 stroke-dasharray=%222 14%22 d=%22M70 900C150 820 60 720 170 660S330 700 380 600 300 470 420 400 560 330 540 210%22/%3E%3Cg opacity=%22.2%22 stroke-width=%224%22%3E%3Cpath d=%22M524 192l32 32M556 192l-32 32%22/%3E%3C/g%3E%3Cg opacity=%22.13%22 stroke-width=%221.5%22 transform=%22translate%2896 330%29%22%3E%3Ccircle r=%2246%22/%3E%3Ccircle r=%2234%22/%3E%3Cpath d=%22M0-60L9-9 60 0 9 9 0 60-9 9-60 0-9-9Z%22/%3E%3Cpath d=%22M-30-30L30 30M30-30L-30 30%22/%3E%3C/g%3E%3C/svg%3E");
  background-repeat:no-repeat,repeat-y;background-position:center top,center top}
#app{max-width:640px;margin:0 auto;padding-block:16px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2{margin:0;font-family:var(--title);font-weight:400;line-height:1;text-wrap:balance}
h1{font-size:clamp(56px,16.5vw,108px);transform:rotate(-3deg);transform-origin:center;text-align:center;padding-block:10px 14px}
h1 span{display:block;font-size:.46em;letter-spacing:.12em;color:var(--fg)}
h1 b{display:block;font-weight:400;line-height:1.05;background:linear-gradient(#fff0b0 8%,#f2b33d 48%,#c2611a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #7a3410) drop-shadow(0 6px 0 #2e1206) drop-shadow(0 14px 22px rgba(0,0,0,.6))}
h1.solo{background:linear-gradient(#fff0b0 8%,#f2b33d 48%,#c2611a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3410) drop-shadow(0 6px 0 #2e1206)}
h2{font-size:clamp(30px,7.5vw,42px);color:var(--accent)}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--dim)} .small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.stripes{height:12px;border-radius:3px;background:repeating-linear-gradient(115deg,var(--accent) 0 22px,#111 22px 44px)}

/* HUD */
.slate{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px}
.slate .cell{padding:8px 12px;border-inline-start:1px solid var(--line);min-width:0}
.slate .cell:first-child{border:0}
.slate .k{font-size:.72rem;color:var(--dim);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.slate .v.low{color:var(--warn)}
.slate .v{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:.95;color:var(--accent);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.slate .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec)}
.strip{display:flex;gap:6px;direction:ltr}
.strip i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.strip i.on{background:var(--accent)} .strip i.now{background:#fff}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:inset 0 0 0 5px var(--panel),inset 0 0 0 6px rgba(242,179,61,.16)}
/* a piece of the treasure map */
.clue{background:var(--parch);color:var(--parch-ink);padding:16px;border-radius:3px;display:flex;flex-direction:column;gap:10px;transform:rotate(-.7deg);
  background-image:radial-gradient(circle at 12% 18%,rgba(120,70,20,.22),rgba(120,70,20,0) 34%),radial-gradient(circle at 88% 86%,rgba(120,70,20,.28),rgba(120,70,20,0) 40%);
  box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 0 0 2px rgba(90,50,15,.35),inset 0 0 40px rgba(120,70,20,.3);
  clip-path:polygon(0 2%,6% 0,19% 1.5%,33% 0,52% 1.2%,70% 0,86% 1.6%,100% 0,99% 22%,100% 47%,98.6% 71%,100% 100%,84% 98.6%,63% 100%,41% 98.5%,22% 100%,7% 98.8%,0 100%,1.2% 70%,0 44%,1.4% 20%)}
.clue:nth-child(even){transform:rotate(.6deg)}
.clue .eyebrow{color:#7a4a1c;font-family:var(--display);font-size:1.4rem;letter-spacing:0;line-height:1;font-weight:700}
.clue .big{font-family:var(--title);font-weight:400;font-size:1.45rem}
.clue .vf{border-color:#7a4a1c}
.score{font-family:var(--title);font-size:clamp(64px,18vw,104px);line-height:1;text-align:center;background:linear-gradient(#fff0b0 8%,#f2b33d 48%,#c2611a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3410) drop-shadow(0 6px 0 #2e1206)}
.bq.good{border-color:var(--ok);color:var(--ok)}
.btimer{display:flex;align-items:center;gap:14px;direction:ltr}
.btimer b{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:.9;color:var(--accent);min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.btimer i{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.btimer u{display:block;height:100%;background:var(--accent);border-radius:5px}
.btimer.low b{color:var(--warn)} .btimer.low u{background:var(--warn)}
.card.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 12px 50px rgba(242,179,61,.2),inset 0 0 0 5px var(--panel),inset 0 0 0 6px rgba(242,179,61,.16)}
.eyebrow{font-size:.75rem;font-weight:500;letter-spacing:.06em;color:var(--dim)}
.tape{align-self:flex-start;color:var(--accent);font-weight:700;font-size:.95rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tape::before{content:"";width:18px;height:2px;background:var(--accent)}
.big{font-size:1.5rem;font-weight:700;line-height:1.3}
.tape{font-family:var(--display);font-size:1.7rem!important;line-height:1;letter-spacing:0!important}
legend{font-family:var(--display);font-size:1.7rem!important;line-height:1}

button{font:inherit;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--fg);
  padding:13px 18px;border-radius:12px;cursor:pointer;min-height:54px;text-align:center}
button:active{background:rgba(255,255,255,.1)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800;font-size:1.25rem;border-radius:999px;min-height:60px}
button.primary:active{filter:brightness(.9)}
button.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
button.cut{border-color:var(--warn);color:var(--warn)}
button.ghost{font-weight:500;min-height:44px;padding:8px 14px;font-size:.95rem;color:var(--dim);border-radius:999px}
button.wide{width:100%}
button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt{text-align:start;font-weight:500;font-size:1.1rem}
.opt.bad{border-color:var(--warn);color:var(--warn);text-decoration:line-through;opacity:.7}
.msg{font-weight:700;color:var(--warn)} .msg.good{color:var(--ok)}
.shutter{align-self:center;width:84px;height:84px;min-height:84px;padding:0;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center}
.shutter span{width:64px;height:64px;border-radius:50%;background:var(--rec);transition:transform .1s}
.shutter:active span{transform:scale(.86)}
.shutlbl{text-align:center;font-weight:700}

/* viewfinder frame around every picture */
.vf{position:relative;background:#000;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line)}
.vf img,.vf svg{width:100%;height:100%;object-fit:cover;display:block}
.vf.fit img{object-fit:contain}
.vf::before,.vf::after{content:"";position:absolute;inset:9px;pointer-events:none;z-index:2;
  background:
   linear-gradient(var(--fg),var(--fg)) top left/22px 3px no-repeat,linear-gradient(var(--fg),var(--fg)) top left/3px 22px no-repeat,
   linear-gradient(var(--fg),var(--fg)) bottom right/22px 3px no-repeat,linear-gradient(var(--fg),var(--fg)) bottom right/3px 22px no-repeat}
.vf::after{transform:scaleX(-1)}
.vf .g{position:absolute;inset:0;pointer-events:none;opacity:.28;
  background:linear-gradient(#fff,#fff) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff,#fff) 66.66% 0/1px 100% no-repeat,
   linear-gradient(#fff,#fff) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff,#fff) 0 66.66%/100% 1px no-repeat}
.vf .tag{position:absolute;z-index:3;left:18px;bottom:16px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
  background:rgba(0,0,0,.6);padding:2px 7px;border-radius:4px;direction:ltr;display:flex;align-items:center;gap:6px}
.vf .tag.take::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ladder figure,.sheet figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.ladder figcaption,.sheet figcaption{font-size:.8rem;color:var(--dim)}
@media (max-width:460px){.two{grid-template-columns:1fr}.ladder{grid-template-columns:repeat(2,1fr)}}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;color:var(--dim);font-size:.9rem}
.stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 8px}
.stats b{display:block;font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:.9;color:var(--accent);direction:ltr;font-variant-numeric:tabular-nums}

label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:500;color:var(--dim)}
input[type=text],input[type=password],textarea,select{font:inherit;font-size:1rem;color:var(--fg);background:#0f1014;
  border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
textarea{min-height:64px;resize:vertical}
.pin{font-family:var(--mono)!important;font-size:1.6rem!important;letter-spacing:.35em;text-align:center;max-width:220px;direction:ltr}
fieldset{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--panel)}
legend{font-weight:700;font-size:1rem;padding:0 8px;color:var(--accent)}
.brand{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--dim);direction:ltr;padding-top:10px}
.brand b{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .card{animation:in .22s ease-out} @keyframes in{from{transform:translateY(8px)}to{transform:none}}
  .btimer.low b{animation:beat .5s ease-in-out infinite alternate} @keyframes beat{to{transform:scale(1.25)}}
  .card.win .clue{animation:pop .5s ease-out} @keyframes pop{from{transform:scale(.9) rotate(-4deg)}to{transform:rotate(-.7deg)}}
}
</style>
<!--/head-->
</head>

var mem={},dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise(function(res){try{var r=indexedDB.open('frame-adventure',1);
 r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};}catch(e){res(null);}});return dbp;}
function load(k){return db().then(function(d){if(!d)return mem[k];return new Promise(function(res){try{var q=d.transaction('kv').objectStore('kv').get(k);
 q.onsuccess=function(){res(q.result);};q.onerror=function(){res(mem[k]);};}catch(e){res(mem[k]);}});});}
function save(k,v){mem[k]=v;db().then(function(d){if(!d)return;try{d.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}});}

function render(keep){app.innerHTML=V[view]()+'<footer class="brand">G.Z <b>a</b>LAB</footer>';if(!keep)window.scrollTo(0,0);}
function go(v){view=v;msg='';armed='';render();}

/* ---------- actions ---------- */
var A={
 start:function(){if(P&&!P.end&&!arm('start'))return;var n=G.stations.length,o=[];for(var i=0;i<n;i++)o.push(i);for(i=n-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=o[i];o[i]=o[j];o[j]=x;}
  P={name:tname.trim(),start:Date.now(),t0:Date.now(),score:0,bonus:{},order:o,pos:0,stage:'go',takes:0,takesAll:0,wrong:0,shots:{},bad:[]};saveP();go('play');},
 resume:function(){go(P.end?'done':timeUp()?'timeup':P.pos>=G.stations.length?'hunt':'play');},
 home:function(){unlocked=false;go('home');},

 ans:function(v){var s=G.stations[cur()];if(+v===s.ans){var g=P.bad.length===0?30:P.bad.length===1?10:0;P.score+=g;snd('good');P.stage='shoot';P.bad=[];P.lastB=null;saveP();go('play');msg='נכון מאוד!'+(g?' קיבלתם '+g+' נקודות.':'');msgGood=true;render();}
  else{snd('bad');P.wrong++;P.bad.push(+v);saveP();msg='לא מדויק. נסו שוב.';msgGood=false;render(true);}},
 hint:function(){P.hint=true;saveP();render(true);},
 cam:function(){camFor='shot';document.getElementById('cam').click();},
 check:function(){if(G.approval==='teacher'){P.checked=true;saveP();render(true);}else A.approve();},
 retake:function(){P.checked=false;P.pending='';P.stage='shoot';saveP();go('play');},
 approve:function(){if(G.approval==='teacher'){var p=document.getElementById('pin').value.trim();if(p!==String(G.pin)&&p!==resp(P.chal)){snd('bad');msg='קוד שגוי. רק הבמאי מאשר שוטים.';msgGood=false;render(true);return;}}
  snd('win');var g=100+(P.takes===1?20:0);P.score+=g;P.gain='קיבלתם '+g+' נקודות'+(P.takes===1?', כולל בונוס על טייק ראשון.':'.');P.lastB=null;P.shots[cur()]=P.pending;P.pending='';P.checked=false;P.stage='reward';saveP();go('play');},

 mins:function(v){G.minutes=+v;armed='';saveG();render(true);},
 mdone:function(){var s=G.stations[cur()],p=document.getElementById('mcode').value;if(!norm(p)||(norm(p)!==norm(s.mcode)&&p.trim()!==String(G.pin))){snd('bad');msg='קוד שגוי. רק מי שנמצא בתחנה מאשר את המשימה.';msgGood=false;render(true);return;}
  snd('win');P.score+=100;P.gain='המשימה הצליחה! קיבלתם 100 נקודות.';P.lastB=null;P.stage='reward';saveP();go('play');},
 mskip:function(){if(!arm('mskip'))return;P.gain='הפעם בלי נקודות, אבל הרמז שלכם.';P.lastB=null;P.stage='reward';saveP();go('play');},

 bonus:function(v){var i=nextBonus();if(i<0)return;var b=G.bonus[i],late=v==='t',ok=!late&&+v===b.ans;P.bonus[i]=ok;P.bOpen=0;P.bAt=(P.bAt||0)+1;snd(ok?'good':'bad');if(ok)P.score+=50;

  P.t0=Date.now();P.chal2=0;saveP();A.resume();snd('good');},
 resett:function(){if(P&&!P.end){P.t0=Date.now();P.chal2=0;saveP();msg='הטיימר אופס. לצוות יש שוב '+(+G.minutes)+' דקות.';}else msg='אין משחק פעיל בטאבלט הזה.';msgGood=true;render(true);},
 code:function(){if(norm(document.getElementById('code').value)===norm(G.code)){P.score+=200+(+G.minutes?Math.max(0,Math.floor(left()/60000))*10:0);P.end=Date.now();saveP();go('done');snd('treasure');}

 gate:function(){go('gate');},
 enter:function(){if(document.getElementById('gpin').value===String(G.pin)){unlocked=true;go('edit');}else{snd('bad');msg='קוד שגוי.';render(true);}},
 addst:function(){G.stations.push({clue:'',where:'',q:'',opts:['','',''],ans:0,shot:'MS',task:'',type:'shot',mcode:'',img:''});syncClues();saveG();render(true);},
 delst:function(v){if(!arm('del'+v))return;G.stations.splice(+v,1);syncClues();saveG();render(true);},

 cluepick:function(v){camFor={clue:+v};document.getElementById('pick').click();},
 cluedel:function(v){G.clues[+v].img='';saveG();render(true);},

 imp:function(){document.getElementById('imp').click();},
 resetp:function(){if(!arm('resetp'))return;P=null;save('prog',null);msg='ההתקדמות נמחקה.';msgGood=true;render(true);},

};

 if(a!==armed.replace(/\d+$/,'')&&['start','delst','delbq','resetp','resetg','mskip'].indexOf(a)<0)armed='';msg='';cue='click';A[a](b.getAttribute('data-v'));play(cue);});

/* ---------- photos: shrink before storing so the tablet does not fill up ---------- */
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var m=1280,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72));};im.onerror=function(){cb('');};im.src=r.result;};
 r.onerror=function(){cb('');};r.readAsDataURL(file);}
function onPhoto(e){var f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;shrink(f,function(d){
  if(!d){msg='לא הצלחנו לקרוא את התמונה. נסו שוב.';msgGood=false;render(true);return;}
  if(camFor==='shot'){P.pending=d;P.checked=false;P.chal=10+Math.floor(Math.random()*90);P.takes++;P.takesAll++;P.stage='review';saveP();go('play');}
  else if(camFor&&camFor.st!=null&&G.stations[camFor.st]){G.stations[camFor.st].img=d;saveG();render(true);}
  else if(camFor&&G.clues[camFor.clue]){G.clues[camFor.clue].img=d;saveG();render(true);}});}
document.getElementById('cam').addEventListener('change',onPhoto);

  catch(x){msg='זה לא קובץ משחק תקין.';msgGood=false;}render(true);};r.readAsText(f);});
